name: atik_toplama_app
description: Dijital Atik Toplama Platformu - MVP
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.5.1

  # --- Harita ve Konum ---
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0        # Cihazin GPS konumunu almak icin
  # Flutter Web'de HTML platform view'lerin (Google Haritalar) uzerindeki
  # Flutter overlay'lerinin tiklamayi YUTMASINI saglar. Bu olmadan slider/
  # buton tiklamalari haritaya sizar ve harita kayar.
  pointer_interceptor: ^0.10.1+2

  # --- Backend (Firebase) ---
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0        # E-posta/sifre ile giris-kayit
  cloud_firestore: ^5.0.1     # Talep kayitlari icin (kalici veri)
  # NOT: firebase_database (Realtime DB) KULLANILMIYOR. Canli konum,
  # Firestore'daki collectorLocation alanindan akiyor. Kullanilmayan
  # bagimlilik lisans beyanini ve teslim edilen kaynak kodu kirletmesin
  # diye kaldirildi (sartname md. 10.4).

  # --- Yardimci ---
  intl: ^0.19.0               # Tarih/saat formatlama
  http: ^1.2.0                # OSRM yol tarifi servisine istek

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
